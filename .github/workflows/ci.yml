name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dan_restaurant_pos/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dan_restaurant_pos/requirements.txt
      - name: Compile application
        run: python -m compileall -q dan_restaurant_pos
      - name: Run tests
        run: python -m pytest dan_restaurant_pos/tests
        env:
          QT_QPA_PLATFORM: offscreen
